[project]
name = "focuseed"
version = "1.0.0"
description = "A CLI focus and Pomodoro tracker"
requires-python = ">=3.12"

[project.scripts]
focuseed = "main:main"

[tool.setuptools]
py-modules = ["main", "constants"]

[tool.setuptools.packages.find]
where = ["."]
include = ["commands*", "utils*", "assets*"]

[tool.setuptools.package-data]
assets = ["*.json"]
